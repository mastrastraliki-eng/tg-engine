id: ua_news
title: "🧭 Тримай курс | Новини"
username: "trymai_kurs_ua"
niche: >
  Головні новини України: війна, фронт за офіційними даними, політика, рішення влади,
  міжнародна підтримка, економіка й життя країни. Для українців, яким потрібні перевірені
  новини без паніки та без пропаганди.
bot_token_env: NEWS_BOT_TOKEN
chat_id_env: NEWS_CHAT_ID
mode: auto                            # публикует сам, без ✅/❌
review_chat_id_env: REVIEW_CHAT_ID
queue_target: 3
sources:
  - {type: rss, url: "https://www.ukrinform.ua/rss/block-lastnews", name: Укрінформ, weight: 1.2}
  - {type: rss, url: "https://www.pravda.com.ua/rss/view_news/", name: Українська правда, weight: 1.2}
  - {type: telegram, channel: suspilnenews, name: Суспільне, weight: 1.2}   # сайт отдаёт 403 ботам
  - {type: rss, url: "https://www.rbc.ua/static/rss/all.ukr.rss.xml", name: РБК-Україна}
  - {type: rss, url: "https://www.eurointegration.com.ua/rss/", name: Європейська правда, weight: 0.9}
  - {type: telegram, channel: V_Zelenskiy_official, name: Володимир Зеленський, weight: 1.3}
  - {type: telegram, channel: GeneralStaffZSU, name: Генштаб ЗСУ, weight: 1.1}
  # ещё разные редакции, чтобы новости были не из одного места; из Telegram — живые фото и видео
  - {type: telegram, channel: uniannet, name: УНІАН, weight: 1.1}
  - {type: telegram, channel: hromadske_ua, name: hromadske, weight: 1.1}
  - {type: telegram, channel: Ukrenergo, name: Укренерго, weight: 1.3,
     include_regex: "відключен|графік|енергосистем|знеструм|електропостачан"}
  - {type: rss, url: "https://tsn.ua/rss/full.rss", name: ТСН}
  - {type: rss, url: "https://www.radiosvoboda.org/api/zrqiteuuir", name: Радіо Свобода}
  - {type: rss, url: "https://www.epravda.com.ua/rss/view_news/", name: Економічна правда, weight: 0.9}
  - {type: rss, url: "https://nv.ua/ukr/rss/all.xml", name: NV}
schedule:
  # как у УНІАН/Суспільне днём, но без ночной ленты: ~22 поста с 7:00 до 23:00, примерно раз в 40 минут
  posts_per_day: 22
  active_hours: [7, 23]
  min_gap_minutes: 30
style:
  images: source_or_card          # настоящие фото/видео из источника, иначе карточка с заголовком
  card_color: "#0057b7"
  ai_images: "off"                 # никаких сгенерированных картинок в новостях о войне
  media_mix: {source: 6, card: 1}  # фото и видео из новостей, иногда фирменная карточка; видео берётся всегда
  language: uk
  voice: "Чітко, жваво й по фактах, як сильний редактор новин: цікаво читати, але з повагою до теми війни. Без паніки, без емоційних оцінок, без жартів про війну."
  design: >
    Яскраво, як у топових новинних каналах (УНІАН, hromadske): майже кожен абзац починається з емодзі за змістом,
    4–8 емодзі на пост, різні від посту до посту (⚡️ ❗️ 🇺🇦 🌍 🇺🇸 🇪🇺 💰 💸 🏛 ⚖️ 📊 📈 💡 🔌 🚆 🏥 🎓 🛡 🤝 📌 🔸 ▪️ 👉 🗣 📝).
    Заголовок <b>жирним</b>, чіпкий і зрозумілий з першого погляду; ключові цифри, імена й суми <b>жирним</b>.
    СТРУКТУРУ поста задає формат-зразок: повтори саме його скелет і не додавай рубрик, цитат чи кінцівок,
    яких у зразку немає. Пости поспіль мають виглядати по-різному.
    Якщо новина про загиблих, поранених, обстріли чи трагедію: 1–2 стримані емодзі (❗️ 🕯), тон спокійний,
    без яскравих прикрас.
  formats:
    - |
      Блискавка. Зразок:
      ⚡️ <b>[Заголовок-факт]</b>

      [Суть 1–2 реченнями, головна цифра <b>жирним</b>]
    - |
      Головне списком. Зразок:
      ❗️ <b>[Заголовок]</b>

      🔸 [Пункт 1]
      🔸 [Пункт 2]
      🔸 [Пункт 3]

      📌 [Одне речення контексту]
    - |
      Цитата. Тільки якщо в матеріалі є пряма цитата, інакше зроби «Блискавку». Зразок:
      🗣 <b>[Хто] — про [що]</b>

      <blockquote>«[Цитата з матеріалу]»</blockquote>

      👉 [За яких обставин сказано і чому це важливо]
    - |
      Цифра в центрі. Зразок:
      💰 <b>[Головна цифра новини, наприклад 2,5 млрд грн]</b>
      [Що це за цифра — один рядок]

      📊 [Контекст 1]
      📈 [Контекст 2 або порівняння]
    - |
      Пояснюємо просто. Зразок:
      🏛 <b>[Заголовок]</b>

      [Суть одним реченням]

      🔎 <b>Що це означає для вас:</b>
      ▪️ [..]
      ▪️ [..]
    - |
      Хронологія. Зразок:
      📝 <b>[Заголовок]</b>

      🕐 [Крок 1 / час, якщо є в матеріалі]
      🕑 [Крок 2]
      🕒 [Крок 3]

      ➡️ [Що далі]
    - |
      Світ про Україну. Для новин з-за кордону. Зразок:
      🌍 <b>[Країна/лідер]: [заголовок]</b>

      🇺🇦 [Що це означає для України]
      🤝 [Деталі домовленості чи заяви]
    - |
      Корисне. Для графіків світла, виплат, правил, змін для людей. Зразок:
      💡 <b>[Заголовок]</b>

      ✅ [Що змінюється]
      📅 [З якої дати / для кого]
      👉 [Що робити читачу — тільки з матеріалу]
  rules:
    - "ЗАБОРОНЕНО (воєнний стан): точні місця й наслідки влучань, якщо їх не оприлюднила влада; роботу ППО; переміщення, розташування й кількість військ і техніки; фото і відео, з яких видно позиції. Якщо матеріал цього стосується, suitable=false."
    - "Дані про фронт і втрати ворога подавай тільки з посиланням на офіційне джерело (Генштаб, Міноборони, ОВА)."
    - "Політика нейтрально: факти, хто що заявив чи ухвалив. Без власних оцінок політиків і партій."
    - "Відхиляй чутки, «інсайди» без джерела, матеріали з російських джерел і непідтверджені заяви."
    - "Не публікуй імена й фото загиблих та поранених, якщо це не офіційне повідомлення."
  max_chars: 900
  hashtags: 0
  include_source_link: true
  signature: ""
filters:
  exclude_keywords: ["реклама", "партнерський", "промо"]
  max_age_hours: 6
digest:                             # вечером главные новости дня ссылками на посты
  enabled: true
  time: "21:30"
  title: "🗞 Головне за день"
  max_items: 7
promo:
  enabled: true
  every_days: 4
  partners: [crypto_news, ai_tools]
