id: ua_news
title: "🧭 Тримай курс | Новини"
username: "trymai_kurs_ua"
niche: >
  Головні новини України: війна, фронт за офіційними даними, політика, рішення влади,
  міжнародна підтримка, економіка й життя країни. Для українців, яким потрібні перевірені
  новини без паніки та без пропаганди.
bot_token_env: NEWS_BOT_TOKEN
chat_id_env: NEWS_CHAT_ID
mode: auto                            # публикует сам, без ✅/❌
review_chat_id_env: REVIEW_CHAT_ID
queue_target: 2
sources:
  - {type: rss, url: "https://www.ukrinform.ua/rss/block-lastnews", name: Укрінформ, weight: 1.2}
  - {type: rss, url: "https://www.pravda.com.ua/rss/view_news/", name: Українська правда, weight: 1.2}
  - {type: telegram, channel: suspilnenews, name: Суспільне, weight: 1.2}   # сайт отдаёт 403 ботам
  - {type: rss, url: "https://www.rbc.ua/static/rss/all.ukr.rss.xml", name: РБК-Україна}
  - {type: rss, url: "https://www.eurointegration.com.ua/rss/", name: Європейська правда, weight: 0.9}
  - {type: telegram, channel: V_Zelenskiy_official, name: Володимир Зеленський, weight: 1.3}
  - {type: telegram, channel: GeneralStaffZSU, name: Генштаб ЗСУ, weight: 1.1}
schedule:
  posts_per_day: 10
  active_hours: [7, 22]             # с 7:00 до 22:00 по Киеву, ночью тишина
  min_gap_minutes: 60
style:
  images: source_or_card          # настоящие фото/видео из источника, иначе карточка с заголовком
  card_color: "#0057b7"
  ai_images: "off"                 # никаких сгенерированных картинок в новостях о войне
  language: uk
  voice: "Чітко, жваво й по фактах, як сильний редактор новин: цікаво читати, але з повагою до теми війни. Без паніки, без емоційних оцінок, без жартів про війну."
  design: "Емодзі помірно, 2–3 на пост; головне речення або цифри можна виділити <b>жирним</b>."   # тобі подобається, не чіпаємо
  formats:
    - "Сильний заголовок з одним доречним емодзі. Перший абзац: головне в одному реченні жирним. Далі 2–3 короткі абзаци деталей і в кінці рядок «❓ Що це означає:» з поясненням."
    - "Заголовок, потім «Головне:» і 3 пункти списком, кожен з нового рядка з маркером ▪️. В кінці одне речення контексту курсивом."
    - "Якщо в матеріалі є пряма цитата посадовця, почни з неї в тезі <blockquote>, потім хто це сказав і за яких обставин, і чому це важливо. Якщо цитати немає, зроби короткий пост: заголовок, суть, контекст."
    - "Хронологія: заголовок, потім що сталося крок за кроком (3–4 короткі рядки з часом або послідовністю, якщо вона є в матеріалі), і в кінці що далі."
    - "Коротка блискавка: заголовок з ⚡️, 2 речення суті, головна цифра жирним. Без зайвого."
  rules:
    - "ЗАБОРОНЕНО (воєнний стан): точні місця й наслідки влучань, якщо їх не оприлюднила влада; роботу ППО; переміщення, розташування й кількість військ і техніки; фото і відео, з яких видно позиції. Якщо матеріал цього стосується, suitable=false."
    - "Дані про фронт і втрати ворога подавай тільки з посиланням на офіційне джерело (Генштаб, Міноборони, ОВА)."
    - "Політика нейтрально: факти, хто що заявив чи ухвалив. Без власних оцінок політиків і партій."
    - "Відхиляй чутки, «інсайди» без джерела, матеріали з російських джерел і непідтверджені заяви."
    - "Не публікуй імена й фото загиблих та поранених, якщо це не офіційне повідомлення."
  max_chars: 900
  hashtags: 0
  include_source_link: true
  signature: ""
filters:
  exclude_keywords: ["реклама", "партнерський", "промо"]
  max_age_hours: 6
promo:
  enabled: true
  every_days: 4
  partners: [crypto_news]
