id: wow_facts
title: "Ого, факти"
username: "@ogo_facts_ua"
niche: >
  Розважальний канал з дивовижними, але правдивими фактами про науку, космос, історію,
  тварин і людей. Легке читання на 30 секунд, яким хочеться поділитися з другом.
bot_token_env: FACTS_BOT_TOKEN
chat_id_env: FACTS_CHAT_ID
mode: review
review_chat_id_env: REVIEW_CHAT_ID
sources:
  # Reddit блокирует анонимный .json, поэтому берём его RSS-ленты
  - {type: rss, url: "https://www.reddit.com/r/todayilearned/top/.rss?t=day", name: r/todayilearned}
  - {type: rss, url: "https://www.reddit.com/r/Damnthatsinteresting/top/.rss?t=day", name: r/Damnthatsinteresting, weight: 0.8}
  - {type: rss, url: "https://www.sciencealert.com/feed", name: ScienceAlert}
  - {type: rss, url: "https://www.livescience.com/feeds/all", name: Live Science}
  - {type: rss, url: "https://www.atlasobscura.com/feeds/latest", name: Atlas Obscura, weight: 0.9}
  - {type: rss, url: "https://www.nasa.gov/feeds/iotd-feed/", name: NASA Image of the Day, use_images: true, weight: 1.3}
schedule:
  posts_per_day: 4
  active_hours: [10, 23]
  min_gap_minutes: 90
  jitter: 0.4
style:
  language: uk
  voice: "Легко, з гумором і щирим здивуванням. Як цікавий співрозмовник, а не підручник."
  rules:
    - "Відхиляй усе, що схоже на міф, політику, трагедії, насильство або 18+."
    - "Закінчуй коротким питанням до читача або несподіваним висновком."
  max_chars: 600
  hashtags: 0
  include_source_link: false
  signature: "@ogo_facts_ua"
filters:
  max_age_hours: 72
  min_title_len: 8
promo:
  enabled: true
  every_days: 7
  partners: [ai_tools]
