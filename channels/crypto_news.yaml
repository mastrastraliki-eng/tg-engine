id: crypto_news
title: "📈 Крипто Пульс"
username: ""                          # впиши @username, когда канал станет публичным
niche: >
  Новини криптовалют і блокчейну: ринок BTC/ETH, регулювання, великі угоди, біржі,
  злами та безпека. Для людей, які тримають крипту, а не для трейдерів-скальперів.
bot_token_env: CRYPTO_BOT_TOKEN
chat_id_env: CRYPTO_CHAT_ID
mode: review                          # спочатку модеруємо вручну, потім можна auto
review_chat_id_env: REVIEW_CHAT_ID
queue_target: 3
sources:
  - {type: rss, url: "https://forklog.com/feed", name: ForkLog, weight: 1.2}
  - {type: rss, url: "https://incrypted.com/feed/", name: Incrypted, weight: 1.2}
  - {type: rss, url: "https://bits.media/rss2/", name: Bits.media, weight: 0.8}
  - {type: rss, url: "https://www.coindesk.com/arc/outboundfeeds/rss/", name: CoinDesk, fetch_full_text: true}
  - {type: rss, url: "https://www.theblock.co/rss.xml", name: The Block, fetch_full_text: true}
  - {type: rss, url: "https://cointelegraph.com/rss", name: Cointelegraph}
  - {type: rss, url: "https://decrypt.co/feed", name: Decrypt, weight: 0.9}
schedule:
  posts_per_day: 7
  active_hours: [8, 23]
  min_gap_minutes: 50
style:
  images: source_or_card
  card_color: "#f7931a"
  ai_images: always                # своя ИИ-иллюстрация к каждому посту; фото статьи — запасной вариант
  ai_style: >
    Photorealistic cinematic editorial image, like a Bloomberg or Forbes magazine cover photo: realistic objects and
    scenes, dramatic lighting, shallow depth of field, dark moody tones with warm orange accent light, high detail, 35mm.
  language: ru
  voice: >
    Дерзко, смешно и по делу, как самый остроумный друг в крипто-чате: ирония, мемные сравнения, крипто-сленг
    (холдеры, киты, памп, дамп, «купил на хаях»), неожиданные панчлайны. Но факты точные, без пошлости, без мата,
    без «to the moon» и без советов покупать.
  design: >
    Пост короткий: 3–6 строк текста плюс заголовок. Первая строка — рубрика-значок, выбери одну по смыслу:
    «🚨 Срочно», «🧠 Разбор», «🤡 Крипто-цирк», «🐋 Киты», «💸 Деньги», «⚖️ Регуляторы», «🔐 Взлом», «📈 Рынок».
    Затем заголовок в <b>жирном</b>, ироничный или с неожиданным углом. Каждая строка начинается со своего эмодзи по
    смыслу. Цифры, суммы, названия монет и компаний — <b>жирным</b>. В конце один сильный панчлайн в <blockquote>.
    Перед хэштегом разделитель ➖➖➖. Эмодзи 5–8 на пост, не больше одного подряд.
  editor: true                     # автор пишет 2 варианта, редактор выбирает и докручивает
  formats:
    - "Ироничный хук-вопрос в заголовке. 2–3 строки сути. Панчлайн: что это значит для обычного холдера."
    - "Три факта списком, каждый со своим эмодзи и с ироничным комментарием в конце строки. Панчлайн-вывод."
    - "Мемное сравнение из жизни, которое объясняет новость (как будто рассказываешь другу в чате), потом факты коротко."
    - "Сухой факт и неожиданный поворот: первая строка — серьёзно, вторая — «но есть нюанс», дальше суть и панчлайн."
    - "Было → стало → что дальше, три строки с эмодзи ⏪ ⚡️ 🔮, и панчлайн."
    - "Новость глазами персонажа: кита, новичка, регулятора или биржи, одной-двумя репликами, потом факты и панчлайн."
  rules:
    - "Никогда не давай инвестиционных советов и прогнозов цены. Если новость о цене, только факты."
    - "Объясняй термины одним предложением, если они неочевидны новичку."
    - "Отклоняй пресс-релизы новых токенов, airdrop-ы, ICO и платные публикации."
  max_chars: 600
  hashtags: 1
  include_source_link: true
  signature: ""
filters:
  exclude_keywords: ["sponsored", "press release", "партнерський матеріал", "presale"]
  max_age_hours: 24
promo:
  enabled: true
  every_days: 5
  partners: [ua_news]
market_summary:
  enabled: true
  time: "09:00"
  coins: [bitcoin, ethereum, solana, binancecoin, ripple, the-open-network]
  movers: 3
