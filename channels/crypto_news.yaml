id: crypto_news
title: "📈 Крипто Пульс"
username: ""                          # впиши @username, когда канал станет публичным
niche: >
  Новини криптовалют і блокчейну: ринок BTC/ETH, регулювання, великі угоди, біржі,
  злами та безпека. Для людей, які тримають крипту, а не для трейдерів-скальперів.
bot_token_env: CRYPTO_BOT_TOKEN
chat_id_env: CRYPTO_CHAT_ID
mode: review                          # спочатку модеруємо вручну, потім можна auto
review_chat_id_env: REVIEW_CHAT_ID
queue_target: 3
sources:
  - {type: rss, url: "https://forklog.com/feed", name: ForkLog, weight: 1.2}
  - {type: rss, url: "https://incrypted.com/feed/", name: Incrypted, weight: 1.2}
  - {type: rss, url: "https://bits.media/rss2/", name: Bits.media, weight: 0.8}
  - {type: rss, url: "https://www.coindesk.com/arc/outboundfeeds/rss/", name: CoinDesk, fetch_full_text: true}
  - {type: rss, url: "https://www.theblock.co/rss.xml", name: The Block, fetch_full_text: true}
  - {type: rss, url: "https://cointelegraph.com/rss", name: Cointelegraph}
  - {type: rss, url: "https://decrypt.co/feed", name: Decrypt, weight: 0.9}
schedule:
  posts_per_day: 7
  active_hours: [8, 23]
  min_gap_minutes: 50
style:
  images: source_or_card
  card_color: "#f7931a"
  ai_images: no_photo              # ИИ-картинка, если в статье нет фото
  language: ru
  voice: "Живо и с характером, как умный друг в теме крипты: лёгкая ирония, понятные сравнения, без хайпа, пошлости и «to the moon»."
  design: >
    Ярко и красиво, как у топовых крипто-каналов. Заголовок: 1–2 тематических эмодзи в начале (🚀📉🐋💰⚡️🔥🧠🏦),
    весь в <b>жирном</b>. Каждый абзац начинается со своего эмодзи по смыслу. Все цифры, суммы, проценты, названия
    монет и компаний выделяй <b>жирным</b>. Одну самую сочную мысль или цитату оформи в <blockquote>. Итоговую строку
    выдели <i>курсивом</i> или <b>жирным</b> с эмодзи 👉/💡. Перед хэштегом поставь разделитель из одной строки ➖➖➖.
    Всего 5–9 эмодзи на пост, но не больше одного подряд, и без «🚀🚀🚀».
  editor: true                     # автор пишет 2 варианта, редактор выбирает и докручивает
  formats:
    - "Хук-вопрос в заголовке, который цепляет читателя. Затем суть в 2–3 коротких абзацах и в конце строка «👉 Что это значит для тебя:» с практическим выводом."
    - "Заголовок с эмодзи по теме. Затем 3 ключевых факта списком, каждый с новой строки и со своим тематическим эмодзи. В конце одна фраза-вывод курсивом."
    - "Мини-история: начни с живой детали или неожиданного факта из материала, расскажи, что произошло, и закончи, почему это важно. Без списков."
    - "Коротко и метко: заголовок, 2–3 предложения сути, главная цифра или факт выделены жирным. В конце вопрос к подписчикам, чтобы хотелось ответить в комментариях."
    - "Разбор «было → стало»: что было раньше, что изменилось сейчас, и что дальше. Каждый блок начинается с эмодзи (⏪, ⚡️, 🔮)."
    - "Объясни как новичку: заголовок, затем простое сравнение из обычной жизни, которое объясняет суть новости, и только потом факты. В конце «💡 Коротко:» в одну строку."
  rules:
    - "Никогда не давай инвестиционных советов и прогнозов цены. Если новость о цене, только факты."
    - "Объясняй термины одним предложением, если они неочевидны новичку."
    - "Отклоняй пресс-релизы новых токенов, airdrop-ы, ICO и платные публикации."
  max_chars: 800
  hashtags: 1
  include_source_link: true
  signature: ""
filters:
  exclude_keywords: ["sponsored", "press release", "партнерський матеріал", "presale"]
  max_age_hours: 24
promo:
  enabled: true
  every_days: 5
  partners: [ua_news]
market_summary:
  enabled: true
  time: "09:00"
  coins: [bitcoin, ethereum, solana, binancecoin, ripple, the-open-network]
  movers: 3
